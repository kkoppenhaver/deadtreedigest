<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 380px; padding: 16px; background: #f1e6cf; color: #2b2419;
    font-family: Georgia, serif; font-size: 13px;
  }
  h1, h2 {
    font-family: Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; border-bottom: 2px solid #2b2419; padding-bottom: 6px;
  }
  h2 { margin-top: 24px; font-size: 12px; }
  label { display: block; margin-top: 12px; font-weight: bold; font-size: 12px; }
  input {
    width: 100%; margin-top: 4px; padding: 7px; font-family: "Courier New", monospace;
    font-size: 12px; border: 1.5px solid #2b2419; background: #faf3e3; box-sizing: border-box;
  }
  .row { display: flex; gap: 8px; }
  .row label { flex: 1; }
  button {
    margin-top: 14px; font-family: Helvetica, Arial, sans-serif; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 14px;
    border: 1.5px solid #2b2419; background: #1f4d38; color: #f1e6cf; cursor: pointer;
  }
  .status { margin-left: 10px; font-style: italic; color: #1f4d38; }
  .status.err { color: #bf4e24; }
  .hint { font-size: 11px; font-style: italic; color: #6b5f4d; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Dead Tree Digest — Settings</h1>

  <div id="conn" class="hint">Checking connection…</div>

  <details style="margin-top:10px;">
    <summary style="cursor:pointer;font-size:11px;color:#6b5f4d;">Advanced: connect manually</summary>
    <div class="hint">Normally the setup link from your welcome email does this for you.</div>
    <label>Save token
      <input type="password" id="token" placeholder="your save_token">
    </label>
    <label>API base
      <input type="text" id="apiBase" placeholder="https://api.deadtreedigest.com">
    </label>
    <button id="save">Save settings</button><span class="status" id="status"></span>
  </details>

  <h2>Shipping address</h2>
  <div class="hint">Where your printed issues get mailed. US only for now.</div>
  <label>Full name <input type="text" id="a_name"></label>
  <label>Street <input type="text" id="a_street1"></label>
  <label>Apt / unit (optional) <input type="text" id="a_street2"></label>
  <div class="row">
    <label>City <input type="text" id="a_city"></label>
    <label>State <input type="text" id="a_state" placeholder="IL" maxlength="20"></label>
  </div>
  <div class="row">
    <label>ZIP <input type="text" id="a_postcode"></label>
    <label>Phone <input type="tel" id="a_phone" placeholder="847 555 0100"></label>
  </div>
  <button id="saveAddress">Save address</button><span class="status" id="addrStatus"></span>

  <script src="options.js"></script>
</body>
</html>
