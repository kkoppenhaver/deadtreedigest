<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #f1e6cf; --ink: #2b2419; --pine: #1f4d38; --pine-deep: #14352a;
    --rust: #bf4e24; --ochre: #d9a13b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px; background: var(--paper); color: var(--ink);
    font-family: Georgia, serif; font-size: 13px;
  }
  header {
    background: var(--pine-deep); color: var(--paper); padding: 10px 14px;
    font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  header .tree { color: var(--ochre); }
  main { padding: 14px; }
  .state { text-align: center; padding: 18px 0; font-style: italic; color: #4a4032; }
  .result .title { font-weight: bold; font-size: 14.5px; line-height: 1.25; }
  .result .meta {
    font-family: Helvetica, Arial, sans-serif; font-size: 10.5px; color: #4a4032;
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px;
  }
  .badge {
    display: inline-block; background: var(--pine); color: var(--paper);
    padding: 1px 6px; border-radius: 2px; font-size: 9.5px; margin-right: 4px;
  }
  .badge.review { background: var(--rust); }
  .queue {
    margin-top: 12px; border-top: 1.5px solid var(--ink); padding-top: 9px;
    font-family: "Courier New", monospace; font-size: 11.5px;
  }
  .queue .bar {
    height: 8px; border: 1px solid var(--ink); margin-top: 5px; background: var(--paper);
  }
  .queue .bar span { display: block; height: 100%; background: var(--pine); }
  .actions { margin-top: 12px; display: flex; gap: 8px; }
  button {
    font-family: Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 7px 10px; cursor: pointer;
    border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
  }
  button.primary { background: var(--pine); color: var(--paper); }
  button:disabled { opacity: 0.5; cursor: default; }
  .error { color: var(--rust); font-style: italic; padding: 10px 0; }
  .error a { color: var(--rust); }
  footer {
    padding: 8px 14px; font-size: 10px; font-style: italic; color: #6b5f4d;
    border-top: 1px solid #cdb98f; text-align: center;
  }
</style>
</head>
<body>
  <header><span>Dead Tree Digest</span><span class="tree">▲</span></header>
  <main id="main">
    <div class="state" id="state">Pressing this page…</div>
  </main>
  <footer>Read responsibly. Print deliberately.</footer>
  <script src="popup.js"></script>
</body>
</html>
